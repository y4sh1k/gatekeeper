# Render Blueprint — one-click deploy for Gatekeeper.
# In Render: New → Blueprint → paste your repo URL → Apply.
# The Starter plan is required for the persistent disk (free services can't
# attach disks). Disk is $0.25/GB/month on top of the plan.
services:
  - type: web
    name: gatekeeper
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/status
    disk:
      name: gatekeeper-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
